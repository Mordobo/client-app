name: Deploy Web QA

# Builds the web app against the QA API and deploys it to a dedicated Netlify
# site so https://qa.mordobo.com can serve QA (not production).
#
# Requires GitHub secrets:
#   NETLIFY_AUTH_TOKEN
#   NETLIFY_SITE_ID          (production site — used to detach the QA domain)
#   NETLIFY_SITE_ID_QA       (optional; auto-created as mordobo-web-qa on first run)
#
# Important: a domain alias on the production Netlify site ALWAYS serves the
# production deploy. qa.mordobo.com must live on the dedicated QA site.

on:
  push:
    branches:
      - qa
  workflow_dispatch:

jobs:
  build-and-deploy-qa:
    name: Build and deploy QA web to Netlify
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_ENV: staging
      EXPO_PUBLIC_API_ENV: qa
      EXPO_PUBLIC_API_URL: https://mordobo-api-qa.onrender.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_COMPANY_ADDRESS: ${{ vars.EXPO_PUBLIC_COMPANY_ADDRESS }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID_PROD: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_ID_QA: ${{ secrets.NETLIFY_SITE_ID_QA }}
      QA_SITE_NAME: mordobo-web-qa
      QA_CUSTOM_DOMAIN: qa.mordobo.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static web export (QA API)
        run: npm run build:web

      - name: Resolve QA Netlify site and attach qa.mordobo.com
        id: site
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID_PROD:-}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID missing"
            exit 1
          fi

          AUTH_HEADER="Authorization: Bearer ${NETLIFY_AUTH_TOKEN}"

          if [ -n "${NETLIFY_SITE_ID_QA:-}" ]; then
            QA_ID="${NETLIFY_SITE_ID_QA}"
            echo "Using configured NETLIFY_SITE_ID_QA=${QA_ID}"
          else
            existing="$(curl -sS -H "${AUTH_HEADER}" \
              "https://api.netlify.com/api/v1/sites?filter=all" \
              | node -e "
                const name=process.env.QA_SITE_NAME;
                let raw='';
                process.stdin.on('data',d=>raw+=d);
                process.stdin.on('end',()=>{
                  const sites=JSON.parse(raw);
                  const hit=(sites||[]).find(s => s.name === name);
                  process.stdout.write(hit ? hit.id : '');
                });
              ")"
            if [ -n "${existing}" ]; then
              QA_ID="${existing}"
              echo "Found existing site ${QA_SITE_NAME} id=${QA_ID}"
            else
              account_slug="$(curl -sS -H "${AUTH_HEADER}" \
                "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID_PROD}" \
                | node -e "
                  let raw='';
                  process.stdin.on('data',d=>raw+=d);
                  process.stdin.on('end',()=>{
                    const s=JSON.parse(raw);
                    process.stdout.write(s.account_slug || '');
                  });
                ")"
              echo "Creating Netlify site ${QA_SITE_NAME} (account=${account_slug})"
              create_payload="$(node -e "
                const body={name:process.env.QA_SITE_NAME};
                if (process.env.ACCOUNT) body.account_slug=process.env.ACCOUNT;
                process.stdout.write(JSON.stringify(body));
              " ACCOUNT="${account_slug}")"
              QA_ID="$(curl -sS -X POST -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
                -d "${create_payload}" \
                "https://api.netlify.com/api/v1/sites" \
                | node -e "
                  let raw='';
                  process.stdin.on('data',d=>raw+=d);
                  process.stdin.on('end',()=>{
                    const s=JSON.parse(raw);
                    if (!s.id) { console.error(raw); process.exit(1); }
                    process.stdout.write(s.id);
                  });
                ")"
              echo "Created QA site id=${QA_ID}"
            fi
            echo "::notice::Add GitHub Actions secret NETLIFY_SITE_ID_QA=${QA_ID} so this stays stable."
          fi

          echo "site_id=${QA_ID}" >> "$GITHUB_OUTPUT"
          export QA_ID

          # Best-effort: detach qa.mordobo.com from production and attach it to the
          # QA site. Some Netlify tokens return 401 on domain PATCH — deploy still
          # proceeds; finish the domain move in the Netlify UI if these warn.
          node <<'NODE'
          const token = process.env.NETLIFY_AUTH_TOKEN;
          const prodId = process.env.NETLIFY_SITE_ID_PROD;
          const qaId = process.env.QA_ID;
          const domain = process.env.QA_CUSTOM_DOMAIN;
          const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          };

          async function main() {
            const prodRes = await fetch(`https://api.netlify.com/api/v1/sites/${prodId}`, { headers });
            const prod = await prodRes.json();
            const aliases = Array.isArray(prod.domain_aliases) ? prod.domain_aliases : [];
            const custom = prod.custom_domain || '';
            if (aliases.includes(domain) || custom === domain) {
              const body = { domain_aliases: aliases.filter((d) => d !== domain) };
              if (custom === domain) body.custom_domain = null;
              const res = await fetch(`https://api.netlify.com/api/v1/sites/${prodId}`, {
                method: 'PATCH',
                headers,
                body: JSON.stringify(body),
              });
              if (!res.ok) {
                console.warn(`WARN: could not remove ${domain} from production (${res.status}). Do it in Netlify UI.`);
                console.warn(await res.text());
              } else {
                console.log(`Removed ${domain} from production site`);
              }
            } else {
              console.log(`Production site does not list ${domain}`);
            }

            const qaRes = await fetch(`https://api.netlify.com/api/v1/sites/${qaId}`, { headers });
            const qa = await qaRes.json();
            console.log(`QA site url: ${qa.ssl_url || qa.url}`);
            if (qa.custom_domain === domain || (qa.domain_aliases || []).includes(domain)) {
              console.log(`${domain} already on QA site`);
              return;
            }
            const attach = await fetch(`https://api.netlify.com/api/v1/sites/${qaId}`, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ custom_domain: domain }),
            });
            if (!attach.ok) {
              console.warn(`WARN: could not attach ${domain} to QA site (${attach.status}). Add it in Netlify UI → mordobo-web-qa → Domain management.`);
              console.warn(await attach.text());
            } else {
              console.log(`Attached ${domain} to QA site`);
            }
          }

          main().catch((err) => {
            console.warn('WARN: domain move failed:', err);
          });
          NODE
      - name: Deploy QA build to dedicated Netlify site
        env:
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          npx --yes netlify-cli deploy --no-build --prod --dir=dist \
            --message "QA deploy from GitHub Actions (${{ github.sha }})"
